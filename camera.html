<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <base target="_top">
  <?!= include('Stylesheet'); ?>
  <style>
    body { background:#111; color:#fff; }
    .cam { max-width:640px; margin:0 auto; padding:12px; }
    .users { display:flex; gap:8px; margin-bottom:10px; }
    .users button { flex:1; padding:12px; font-size:16px; border-radius:8px; border:2px solid #444; background:#222; color:#ccc; }
    .users button.on { border-color:#4c8dff; background:#16345f; color:#fff; font-weight:700; }
    .view { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
    video { width:100%; height:100%; object-fit:cover; }
    .view .msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:#bbb; }
    .actions { display:flex; gap:10px; align-items:center; justify-content:center; margin:14px 0; }
    #shutter { width:76px; height:76px; border-radius:50%; border:5px solid #fff; background:#e33; }
    #shutter:disabled { opacity:.35; }
    .pick { display:block; flex:1; text-align:center; padding:18px 10px; border-radius:10px; background:#333; color:#fff; font-size:16px; }
    .pick.main { background:#1f5fbf; font-weight:700; }
    .pick small { display:block; font-size:12px; font-weight:400; color:#cfd8e6; margin-top:2px; }
    .hint { color:#999; font-size:12px; text-align:center; margin:-4px 0 10px; }
    .count { text-align:center; color:#bbb; margin-bottom:8px; }
    .list div { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; border-bottom:1px solid #333; font-size:13px; }
    .list .ng { color:#ff8a80; } .list .ok { color:#8fe3b0; }
    .list button { background:#444; color:#fff; border:0; border-radius:6px; padding:2px 10px; }
  </style>
</head>
<body>
<div class="cam">
  <div class="users" id="users"></div>
  <div class="view" id="view"><video id="video" playsinline autoplay muted></video><div class="msg" id="viewMsg">カメラを起動しています…</div></div>
  <div class="actions" id="shutterRow"><button id="shutter" disabled aria-label="撮影"></button></div>
  <div class="actions">
    <label class="pick main">撮影する<small>1枚ずつ</small><input id="shoot" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="pick">写真をまとめて選ぶ<small>撮影済みの写真から</small><input id="file" type="file" accept="image/*" multiple hidden></label>
  </div>
  <div class="hint" id="hint"></div>
  <div class="count" id="count">利用者を選んでから撮影してください</div>
  <div class="list" id="list"></div>
</div>
<script>
var INIT = <?!= initial ?>;
var user = '', items = [], queue = [], busy = false, seq = 0;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderUsers() {
  $('users').innerHTML = INIT.users.map(function (u) { return '<button data-u="' + esc(u) + '" class="' + (u === user ? 'on' : '') + '">' + esc(u) + '</button>'; }).join('');
  Array.prototype.forEach.call($('users').children, function (b) { b.onclick = function () { user = b.dataset.u; try { localStorage.setItem('receiptUser', user); } catch (e) {} renderUsers(); refresh(); }; });
}
function refresh() {
  var done = items.filter(function (i) { return i.state === 'done'; }).length;
  $('count').textContent = user ? ('利用者：' + user + '　今回 ' + items.length + ' 枚（読み取り済み ' + done + ' 枚）') : '利用者を選んでから撮影してください';
  $('shutter').disabled = !user || !$('video').srcObject;
  var label = { saving: '保存中…', wait: '保存待ち', ocr: '読み取り中…' };
  $('list').innerHTML = items.slice().reverse().map(function (i) {
    if (i.state === 'done') return '<div><span>No.' + esc(i.no) + '　' + esc(i.store || '店名なし') + '</span><span class="ok">' + (i.amount ? Number(i.amount).toLocaleString('ja-JP') + '円' : '金額なし') + '</span></div>';
    if (i.state === 'ngSave') return '<div><span class="ng">保存に失敗しました</span><button onclick="retrySave(' + i.id + ')">再送</button></div>';
    if (i.state === 'ngOcr') return '<div><span>No.' + esc(i.no) + '　<span class="ng">読み取りに失敗（画像は保存済み）</span></span><button onclick="retryOcr(' + i.id + ')">再読取</button></div>';
    return '<div><span>' + (i.no ? 'No.' + esc(i.no) : i.id + '枚目') + '</span><span>' + label[i.state] + '</span></div>';
  }).join('');
}
function byId(id) { return items.filter(function (i) { return i.id === id; })[0]; }

function add(dataUrl, who) {
  var it = { id: ++seq, state: 'wait', data: dataUrl.split(',')[1], mime: 'image/jpeg', user: who };
  items.push(it); queue.push(it); refresh(); pump();
}
// 保存は1枚ずつ順番に（Noの順が撮影順になる）。読み取りは保存後に並行して動かす。
function pump() {
  if (busy || !queue.length) return;
  busy = true;
  var it = queue.shift(); it.state = 'saving'; refresh();
  google.script.run.withSuccessHandler(function (res) {
    it.no = res.no; it.data = null; busy = false; ocr(it); pump();
  }).withFailureHandler(function () { it.state = 'ngSave'; busy = false; refresh(); pump(); }).api_upload({ data: it.data, mime: it.mime, user: it.user });
}
function ocr(it) {
  it.state = 'ocr'; refresh();
  google.script.run.withSuccessHandler(function (res) {
    if (res.ok) { it.state = 'done'; it.store = res.store; it.amount = res.amount; } else it.state = 'ngOcr';
    refresh();
  }).withFailureHandler(function () { it.state = 'ngOcr'; refresh(); }).api_ocr(it.no);
}
function retrySave(id) { var it = byId(id); if (!it || !it.data) return; it.state = 'wait'; queue.push(it); refresh(); pump(); }
function retryOcr(id) { var it = byId(id); if (it) ocr(it); }

// 長辺1800pxまで縮小してJPEGにする（送信を速くするため）
function shrink(source, w, h) {
  var max = 1800, s = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
$('shutter').onclick = function () {
  var v = $('video');
  if (!user || !v.videoWidth) return;
  add(shrink(v, v.videoWidth, v.videoHeight), user);
};
// 選んだ写真を撮影した順（古い順）に1枚ずつ読み込んで追加する
function onPick(e) {
  if (!user) { $('hint').textContent = '先に利用者を選んでください'; e.target.value = ''; return; }
  var who = user;
  var files = Array.prototype.slice.call(e.target.files).sort(function (a, b) { return a.lastModified - b.lastModified; });
  e.target.value = '';
  var next = function () {
    var f = files.shift();
    if (!f) return;
    var img = new Image();
    img.onload = function () { add(shrink(img, img.naturalWidth, img.naturalHeight), who); URL.revokeObjectURL(img.src); next(); };
    img.onerror = function () { $('hint').textContent = '読み込めない写真がありました：' + f.name; URL.revokeObjectURL(img.src); next(); };
    img.src = URL.createObjectURL(f);
  };
  next();
}
$('file').onchange = onPick; $('shoot').onchange = onPick;
// この画面の中でカメラを使えないときは、プレビューを隠してボタンだけにする
function noLiveCamera(reason) {
  $('view').classList.add('hide'); $('shutterRow').classList.add('hide');
  $('hint').textContent = 'この画面の中ではカメラを表示できないため、「撮影する」でスマホのカメラを開きます。' + (reason ? '（' + reason + '）' : '');
}
function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { noLiveCamera(''); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false }).then(function (stream) {
    $('video').srcObject = stream; $('viewMsg').classList.add('hide'); refresh();
  }).catch(function (err) { noLiveCamera(err && err.name); });
}
window.onbeforeunload = function () { if (busy || queue.length) return '保存が終わっていません'; };
try { var saved = localStorage.getItem('receiptUser'); if (saved && INIT.users.indexOf(saved) >= 0) user = saved; } catch (e) {}
renderUsers(); refresh(); startCamera();
</script>
</body>
</html>
